name: Device Sim Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image to ensure the Dockerfile works.
      # Push is set to false because we don't have registry credentials configured yet.
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/device-sim
          file: ./services/device-sim/Dockerfile
          push: false
          tags: device-sim:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
