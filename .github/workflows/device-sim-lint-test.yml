name: Device Sim CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "services/device-sim/**"
      - ".github/workflows/device-sim-lint-test.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "services/device-sim/**"
      - ".github/workflows/device-sim-lint-test.yml"

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/device-sim

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/device-sim/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "services/device-sim/pyproject.toml"

      - name: Install dependencies
        run: uv sync --dev

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run Pytest
        run: uv run pytest tests/

  build-and-publish:
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and publish from main
        uses: docker/build-push-action@v5
        with:
          context: ./services/device-sim
          file: ./services/device-sim/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/device-sim:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/device-sim:latest
          cache-from: type=gha,scope=device-sim
          cache-to: type=gha,mode=max,scope=device-sim
