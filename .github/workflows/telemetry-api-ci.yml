name: Telemetry API CI

on:
  push:
    branches: [main]
    paths:
      - "services/telemetry-api/**"
      - ".github/workflows/telemetry-api-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/telemetry-api/**"
      - ".github/workflows/telemetry-api-ci.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: services/telemetry-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/telemetry-api/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run tests
        run: uv run --frozen pytest tests/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and publish from main
        uses: docker/build-push-action@v5
        with:
          context: ./services/telemetry-api
          file: ./services/telemetry-api/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/telemetry-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/telemetry-api:latest
          cache-from: type=gha,scope=telemetry-api
          cache-to: type=gha,mode=max,scope=telemetry-api
