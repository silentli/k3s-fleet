[project]
name = "telemetry-api"
version = "0.1.0"
description = "MQTT telemetry ingestion and query API for k3s-fleet"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "paho-mqtt==1.6.1",
    "psycopg[binary]==3.2.6",
    "pydantic==2.11.3",
    "pydantic-settings==2.8.1",
    "sqlalchemy==2.0.40",
    "uvicorn[standard]==0.34.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
