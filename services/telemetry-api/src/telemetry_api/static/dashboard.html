<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fleet Dashboard</title>
    <link rel="stylesheet" href="/static/dashboard.css">
  </head>
  <body>
    <main class="page">
      <header>
        <div>
          <p class="eyebrow">Factory fleet</p>
          <h1>Robot overview</h1>
        </div>
        <p id="connection-status" class="connection-status" aria-live="polite">Loading robots…</p>
      </header>

      <section class="dashboard" aria-label="Factory fleet dashboard">
        <div class="floor-panel">
          <svg id="factory-floor" viewBox="0 0 100 100" role="img" aria-label="Factory floor showing stations and robot positions">
            <defs>
              <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
                <path d="M 10 0 L 0 0 0 10" fill="none" stroke="currentColor" stroke-width="0.25" />
              </pattern>
            </defs>
            <rect class="floor" x="0" y="0" width="100" height="100" />
            <rect class="grid" x="0" y="0" width="100" height="100" fill="url(#grid)" />
            <g id="stations"></g>
            <g id="robots"></g>
          </svg>
          <p class="map-caption">Live positions refresh every 5 seconds.</p>
        </div>

        <aside class="robot-panel">
          <h2>Robots</h2>
          <div id="robot-list" class="robot-list" aria-live="polite"></div>
        </aside>
      </section>
    </main>
    <script src="/static/dashboard.js"></script>
  </body>
</html>
